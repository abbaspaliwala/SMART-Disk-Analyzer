<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMART Disk Analyzer</title>
  <meta name="description" content="Reads every SMART parameter of all local disks and forecasts their remaining useful life." />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2338bdf8' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2338bdf8'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="12" />
        <circle cx="16" cy="16" r="4.5" class="brand__hub" />
        <path d="M16 4v6M16 22v6M4 16h6M22 16h6" />
      </svg>
      <div class="brand__text">
        <h1>SMART Disk Analyzer</h1>
        <p id="host-line" class="brand__sub">connecting…</p>
      </div>
    </div>

    <div id="status-chips" class="chips" aria-live="polite"></div>

    <div class="topbar__actions">
      <button id="btn-refresh" class="btn" title="Re-read SMART data from every disk">
        <span aria-hidden="true">⟳</span> Rescan
      </button>
      <button id="btn-capture" class="btn" title="Store a SMART snapshot for every disk (feeds the trend forecast)">
        <span aria-hidden="true">＋</span> Capture
      </button>
      <label class="btn btn--file" title="Analyse smartctl JSON from another machine">
        <span aria-hidden="true">⇪</span> Import
        <input id="file-import" type="file" accept=".json,application/json" multiple hidden />
      </label>
      <button id="btn-theme" class="btn btn--icon" title="Toggle light / dark theme" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <sa-kpi-strip id="kpis"></sa-kpi-strip>

  <main class="layout">
    <aside class="rail">
      <sa-disk-list id="disk-list"></sa-disk-list>
    </aside>
    <section class="content">
      <sa-detail-view id="detail"></sa-detail-view>
    </section>
  </main>

  <footer class="footer">
    <span>SMART data via <code>smartctl</code>. Remaining-life figures are statistical estimates, not guarantees — keep backups.</span>
    <span id="footer-meta"></span>
  </footer>

  <sa-toasts id="toasts"></sa-toasts>
  <sa-import-dialog id="import-dialog"></sa-import-dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
